<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gb-emu web demo</title>
  <style>
    :root {
      --bg: #0e1316;
      --panel: #171f24;
      --text: #e6f2f7;
      --muted: #9bb0be;
      --accent: #57d5a8;
      --border: #2a363e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #1b252c, var(--bg));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(980px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    .control-section {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #10181d;
    }

    .control-section-title {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-right: 2px;
      padding-right: 6px;
      border-right: 1px solid var(--border);
    }

    #persistence-info,
    #bootrom-info {
      color: var(--muted);
      font-size: 13px;
      background: #0f171c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .persistence-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button,
    select,
    input[type="file"],
    .file-button {
      background: #0f171c;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }

    button,
    .file-button {
      cursor: pointer;
    }

    button:hover,
    .file-button:hover {
      border-color: var(--accent);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      border-color: var(--border);
    }

    .file-button.is-disabled {
      cursor: not-allowed;
      opacity: 0.5;
      border-color: var(--border);
      pointer-events: none;
    }

    .file-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .file-picker input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .control-label {
      color: var(--muted);
      font-size: 13px;
    }

    .bootrom-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border);
      color: #8d9da8;
      background: #0f171c;
      font-size: 14px;
      font-weight: 700;
    }

    .bootrom-check.is-valid {
      border-color: #2ea772;
      color: #2ea772;
      background: #10261d;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    #screen {
      width: min(100%, 640px);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    #status {
      color: var(--muted);
      font-size: 14px;
    }

    #audio-telemetry {
      color: #8fd7bd;
      font-size: 13px;
      background: #0f171c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
    }

    #cart-info {
      white-space: pre-wrap;
      margin: 0;
      background: #0f171c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: #cde0eb;
      font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
      font-size: 12px;
    }

    #serial {
      white-space: pre-wrap;
      margin: 0;
      background: #10181d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: #cde0eb;
      min-height: 64px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>gb-emu web demo</h1>
    <section class="controls">
      <div class="control-section" aria-label="ROM and persistence controls">
        <span class="control-section-title">ROM</span>
        <div class="file-picker">
          <label class="file-button" for="rom-file">Load</label>
          <input id="rom-file" type="file" accept=".gb,.gbc,.bin" />
        </div>
        <button id="rom-start" type="button">Start</button>
        <button id="rom-reset" type="button">Reset</button>
        <button id="rom-close" type="button">Close</button>
        <span class="control-label">Hardware</span>
        <select id="model" aria-label="Hardware model">
          <option value="dmg" selected>dmg</option>
          <option value="dmg0">dmg0</option>
          <option value="mgb">mgb</option>
          <option value="sgb">sgb</option>
          <option value="sgb2">sgb2</option>
        </select>
        <span class="control-label">Palette</span>
        <select id="palette" aria-label="Video palette">
          <option value="auto" selected>auto</option>
          <option value="dmg">dmg green</option>
          <option value="mgb">mgb gray</option>
          <option value="cgb">cgb (scaffold)</option>
          <option value="sgb">sgb (scaffold)</option>
        </select>
        <span id="bootrom-model-check" class="bootrom-check" aria-label="Boot ROM validity for selected hardware">✗</span>
        <div class="file-picker">
          <span class="control-label">Boot</span>
          <label id="bootrom-file-button" class="file-button" for="bootrom-file">Load Boot</label>
          <input id="bootrom-file" type="file" accept=".bin,.rom,.gb,.gbc" multiple />
        </div>
        <div class="file-picker">
          <span class="control-label">Save</span>
          <label id="sav-file-button" class="file-button" for="sav-file">Import SAV</label>
          <input id="sav-file" type="file" accept=".sav" />
        </div>
        <button id="sav-download" type="button">Export SAV</button>
        <div class="file-picker">
          <span class="control-label">RTC</span>
          <label id="rtc-file-button" class="file-button" for="rtc-file">Import RTC</label>
          <input id="rtc-file" type="file" accept=".rtc" />
        </div>
        <button id="rtc-download" type="button">Export RTC</button>
      </div>
      <div class="persistence-row">
        <div id="persistence-info" aria-live="polite">
          Persistence: no ROM loaded.
        </div>
        <div id="bootrom-info" aria-live="polite">
          Boot ROM: model dmg not configured.
        </div>
      </div>
      <div class="control-section" aria-label="Audio controls">
        <span class="control-section-title">Audio</span>
        <button id="audio-enable">Enable audio</button>
        <label>
          Resampler
          <select id="audio-resampler">
            <option value="cubic" selected>cubic</option>
            <option value="linear">linear</option>
          </select>
        </label>
        <label>
          <input id="test-tone" type="checkbox" />
          Test tone
        </label>
      </div>
    </section>
    <canvas id="screen" width="160" height="144" aria-label="Game Boy screen"></canvas>
    <div id="status">Load a ROM, then press Start.</div>
    <div id="audio-telemetry">Audio: disabled</div>
    <pre id="cart-info" aria-label="Cartridge metadata">Cartridge: not loaded.</pre>
    <pre id="serial" aria-label="Serial output"></pre>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
