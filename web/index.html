<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GB-EMU</title>
  <style>
    :root {
      --bg: #0a0f13;
      --panel: #131d25;
      --panel-soft: #0d151c;
      --text: #e9f3f9;
      --muted: #95adbd;
      --accent: #67dcae;
      --border: #2a3a45;
      --danger: #dd6b6b;
      --shell: #BDBFC7;
      --shell-deep: #c0c6cf;
      --screen-frame: #828992;
      --battery-off: #2f353c;
      --battery-on: #dc4c59;
      --dot-matrix: #6e7680;
      --shell-label: #BDBFC7;
      --stripe-magenta: #7e3d93;
      --stripe-blue: #3a4f96;
      --logo-blue: #31459a;
      --logo-violet: #5a4fa8;
      --video-scale: 4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, #1f2a33 0%, transparent 45%),
        radial-gradient(circle at 95% 10%, #1a242d 0%, transparent 38%),
        linear-gradient(140deg, #0b1116, var(--bg));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      position: relative;
      width: min(100%, calc(160px * var(--video-scale) + 170px));
      display: grid;
      place-items: center;
    }

    .shell {
      width: 100%;
      background: #BDBFC7;
      border-radius: 10px;
      border: 1px solid #9ea4ac;
      box-shadow:
        0 30px 70px rgb(0 0 0 / 46%),
        inset 0 1px 0 rgb(255 255 255 / 65%);
      padding: 22px 18px 18px;
      color: #2f3439;
    }

    .display-block {
      --display-pad-top: 14px;
      --display-gap: 10px;
      --display-top-height: 22px;
      position: relative;
      background: #616979;
      border-radius: 14px 14px 64px 14px;
      padding:
        var(--display-pad-top)
        12px
        calc(var(--display-pad-top) + var(--display-top-height) + var(--display-gap))
        12px;
      margin: 0 14px;
      border: 1px solid #858b94;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 24%);
      display: grid;
      gap: var(--display-gap);
    }

    .display-top {
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      gap: 8px;
      min-height: var(--display-top-height);
    }

    .dot-matrix-label {
      display: grid;
      grid-template-columns: auto auto auto;
      align-items: center;
      justify-content: end;
      justify-self: end;
      gap: 10px;
      color: var(--shell-label);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
      min-width: 1px;
    }

    .dot-lines {
      width: 420px;
      height: 10px;
      border-radius: 999px;
      background:
        linear-gradient(
          90deg,
          var(--stripe-magenta) 0%,
          var(--stripe-magenta) 100%
        ) top / 100% 3px no-repeat,
        linear-gradient(
          90deg,
          var(--stripe-blue) 0%,
          var(--stripe-blue) 100%
        ) bottom / 100% 3px no-repeat;
      opacity: 0.95;
    }

    .dot-lines.short {
      width: 52px;
    }

    .settings-toggle {
      width: 34px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid #767c85;
      background: linear-gradient(180deg, #c0c6cf, #a4abb5);
      cursor: pointer;
      display: grid;
      gap: 4px;
      align-content: center;
      justify-items: center;
      padding: 0;
    }

    .settings-toggle::before,
    .settings-toggle::after {
      content: "";
      width: 11px;
      height: 3px;
      border-radius: 999px;
      background:
        linear-gradient(
          90deg,
          var(--stripe-magenta) 0%,
          var(--stripe-magenta) 100%
        ) top / 100% 1px no-repeat,
        linear-gradient(
          90deg,
          var(--stripe-blue) 0%,
          var(--stripe-blue) 100%
        ) bottom / 100% 1px no-repeat;
    }

    .settings-toggle:hover {
      border-color: #5a616a;
      background: linear-gradient(180deg, #c8ced6, #acb4be);
    }

    .settings-toggle[aria-expanded="true"] {
      border-color: #3d8f75;
      box-shadow: inset 0 0 0 1px rgb(103 220 174 / 55%);
    }

    .display-main {
      display: grid;
      grid-template-columns: 58px max-content 58px;
      gap: 12px;
      align-items: stretch;
    }

    .screen-wrap {
      position: relative;
      width: max-content;
    }

    .screen-wrap .settings-toggle {
      position: absolute;
      top: 4px;
      left: calc(100% + 10px);
    }

    .battery-cluster {
      display: grid;
      gap: 6px;
      align-content: start;
      justify-items: center;
      min-height: 100%;
      padding-top: 210px;
    }

    .display-spacer {
      min-height: 100%;
    }

    .battery-led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--battery-off);
      border: 1px solid #1c2026;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 20%);
      transition: background-color 140ms ease, box-shadow 180ms ease;
    }

    .battery-led.is-on {
      background: var(--battery-on);
      border-color: #8d313c;
      box-shadow: 0 0 10px rgb(220 76 89 / 90%), inset 0 0 4px rgb(255 255 255 / 55%);
    }

    .battery-label {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--shell-label);
    }

    #screen {
      width: 160px;
      height: 144px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      border: 1px solid #0d0f12;
      border-radius: 2px;
      display: block;
      margin: 0;
      box-shadow: none;
    }

    .logo-row {
      margin: 11px 14px 0;
      display: flex;
      align-items: baseline;
      gap: 2px;
      padding-left: 0;
      color: #23292f;
      flex-wrap: wrap;
    }

    .brand-emu {
      font-size: 20px;
      letter-spacing: 0.01em;
      font-weight: 700;
      color: var(--logo-blue);
      line-height: 0.9;
    }

    .brand-gameboy {
      font-size: 49px;
      letter-spacing: 0.025em;
      font-weight: 500;
      color: var(--logo-blue);
      font-style: italic;
      line-height: 0.86;
    }

    .tm {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--logo-blue);
      margin-left: -1px;
    }

    .context-panel {
      position: absolute;
      top: 54px;
      right: 22px;
      width: min(360px, calc(100vw - 56px));
      max-height: min(78vh, 760px);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgb(15 24 32 / 97%);
      box-shadow: 0 26px 56px rgb(0 0 0 / 45%);
      backdrop-filter: blur(7px);
      padding: 12px;
      display: grid;
      gap: 12px;
      align-content: start;
      animation: panel-enter 180ms ease;
      z-index: 20;
      color: var(--text);
    }

    .context-panel[hidden] {
      display: none;
    }

    .settings-nav {
      display: grid;
      gap: 8px;
    }

    .control-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .control-nav button,
    .context-panel button,
    .context-panel select,
    .file-button {
      width: 100%;
      text-align: left;
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
      transition:
        border-color 140ms ease,
        background-color 140ms ease,
        transform 140ms ease;
    }

    .context-panel button,
    .control-nav button,
    .file-button {
      cursor: pointer;
    }

    .context-panel select {
      text-align: left;
      cursor: pointer;
    }

    .context-panel button:hover,
    .control-nav button:hover,
    .file-button:hover {
      border-color: var(--accent);
      background: #12212b;
    }

    .control-nav button.is-active {
      border-color: var(--accent);
      background: linear-gradient(180deg, #214236, #173027);
      color: #e7fff5;
      box-shadow: inset 2px 0 0 var(--accent);
    }

    button:disabled,
    .file-button.is-disabled {
      cursor: not-allowed;
      opacity: 0.5;
      border-color: var(--border);
    }

    button:disabled:hover,
    .file-button.is-disabled:hover {
      border-color: var(--border);
      background: var(--panel-soft);
    }

    .danger-button {
      border-color: #633a3a;
      color: #f5dede;
      background: #271b1b;
    }

    .danger-button:hover {
      border-color: #ad6262;
      background: #322020;
    }

    .file-picker {
      display: grid;
      gap: 6px;
      width: 100%;
    }

    .file-picker input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .panel-section {
      display: grid;
      gap: 10px;
      align-content: start;
      animation: panel-enter 180ms ease;
    }

    .panel-section[hidden] {
      display: none;
    }

    .panel-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 2px;
      font-weight: 600;
    }

    .inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label,
    .field span {
      color: var(--muted);
      font-size: 13px;
    }

    .status-card {
      color: var(--muted);
      font-size: 13px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 38px;
      display: flex;
      align-items: center;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 2%);
    }

    #audio-telemetry {
      color: #8fd7bd;
      font-size: 13px;
      font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
    }

    #debug-run-state {
      font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
      color: #8fd7bd;
      border-color: #38586a;
      background: #10202b;
    }

    #cart-info,
    #serial {
      white-space: pre-wrap;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: #cde0eb;
      font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
      font-size: 12px;
      background: var(--panel-soft);
    }

    #serial {
      min-height: 100px;
      max-height: 220px;
      overflow: auto;
    }

    .bootrom-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--border);
      color: #8d9da8;
      background: var(--panel-soft);
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .bootrom-check.is-valid {
      border-color: #2ea772;
      color: #2ea772;
      background: #10261d;
    }

    .bootrom-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    @keyframes panel-enter {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 14px;
      }

      .shell {
        padding: 16px 12px 16px;
      }

      .display-block {
        --display-pad-top: 12px;
        --display-gap: 10px;
        --display-top-height: 22px;
        margin: 0 6px;
        padding:
          var(--display-pad-top)
          10px
          calc(var(--display-pad-top) + var(--display-top-height) + var(--display-gap))
          10px;
      }

      .logo-row {
        margin: 11px 6px 0;
      }

      .display-main {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .display-spacer {
        display: none;
      }

      .battery-cluster {
        grid-auto-flow: column;
        justify-content: start;
        gap: 8px;
        justify-items: start;
      }

      .brand-emu {
        font-size: 16px;
      }

      .brand-gameboy {
        font-size: 33px;
      }

      .context-panel {
        top: 32px;
        right: 10px;
        left: 10px;
        width: auto;
        max-height: 74vh;
      }

      .control-nav,
      .inline {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="shell">
      <section class="display-block">
        <div class="display-top">
          <div class="dot-matrix-label">
            <div class="dot-lines"></div>
            <span>DOT MATRIX WITH STEREO SOUND</span>
            <div class="dot-lines short"></div>
          </div>
        </div>

        <div class="display-main">
          <div class="battery-cluster" aria-label="Battery status">
            <span id="battery-led" class="battery-led" aria-hidden="true"></span>
            <span class="battery-label">BATTERY</span>
          </div>
          <div class="screen-wrap">
            <canvas id="screen" width="160" height="144" aria-label="Game Boy screen"></canvas>
            <button
              id="settings-toggle"
              class="settings-toggle"
              type="button"
              title="Setting"
              aria-label="Setting"
              aria-expanded="false"
            ></button>
          </div>
          <div class="display-spacer" aria-hidden="true"></div>
        </div>
      </section>

      <section class="logo-row" aria-label="Branding">
        <span class="brand-emu">Emulator</span>
        <span class="brand-gameboy">GAME BOY</span>
        <span class="tm">TM</span>
      </section>
    </section>

    <aside class="context-panel" aria-label="Settings panel" hidden>
      <div class="settings-nav">
        <div class="file-picker">
          <label class="file-button" for="rom-file">Load ROM</label>
          <input id="rom-file" type="file" accept=".gb,.gbc,.bin" />
        </div>
        <div class="control-nav">
          <button id="control-nav-data" type="button" data-control-section="data">Save Data</button>
          <button id="control-nav-system" type="button" data-control-section="system">System</button>
          <button id="control-nav-audio" type="button" data-control-section="audio">Audio</button>
          <button id="control-nav-debug" type="button" data-control-section="debug">Debug</button>
        </div>
      </div>

      <section id="panel-data" class="panel-section" data-control-panel="data" hidden>
        <span class="panel-label">Save Data</span>
        <div class="inline">
          <div class="file-picker">
            <label id="sav-file-button" class="file-button" for="sav-file">Import SAV</label>
            <input id="sav-file" type="file" accept=".sav" />
          </div>
          <button id="sav-download" type="button">Export SAV</button>
        </div>
        <div class="inline">
          <div class="file-picker">
            <label id="rtc-file-button" class="file-button" for="rtc-file">Import RTC</label>
            <input id="rtc-file" type="file" accept=".rtc" />
          </div>
          <button id="rtc-download" type="button">Export RTC</button>
        </div>
        <div id="persistence-info" class="status-card" aria-live="polite">Info: no ROM loaded.</div>
        <button id="rom-reset" type="button">Reset ROM</button>
      </section>

      <section id="panel-system" class="panel-section" data-control-panel="system" hidden>
        <span class="panel-label">System</span>
        <div class="field">
          <label for="model">Hardware model</label>
          <select id="model" aria-label="Hardware model">
            <option value="dmg" selected>dmg</option>
            <option value="dmg0">dmg0</option>
            <option value="mgb">mgb</option>
            <option value="sgb">sgb</option>
            <option value="sgb2">sgb2</option>
          </select>
        </div>
        <div class="field">
          <label for="palette">Video palette</label>
          <select id="palette" aria-label="Video palette">
            <optgroup label="Automatic / Model">
              <option value="auto" selected>auto</option>
              <option value="dmg">dmg green</option>
              <option value="mgb">mgb gray</option>
              <option value="cgb">cgb auto</option>
              <option value="sgb">sgb runtime</option>
            </optgroup>
            <optgroup label="GB / CGB Presets">
              <option value="grayscale">grayscale</option>
              <option value="gb-pocket">gb pocket</option>
              <option value="gb-light">gb light</option>
              <option value="cgb-brown">cgb brown</option>
              <option value="cgb-red-a">cgb red A</option>
              <option value="cgb-dark-brown-b">cgb dark brown B</option>
              <option value="cgb-pale-yellow">cgb pale yellow</option>
              <option value="cgb-orange-a">cgb orange A</option>
              <option value="cgb-yellow-b">cgb yellow B</option>
              <option value="cgb-blue">cgb blue</option>
              <option value="cgb-dark-blue-a">cgb dark blue A</option>
              <option value="cgb-gray-b">cgb gray B</option>
              <option value="cgb-green">cgb green</option>
              <option value="cgb-dark-green-a">cgb dark green A</option>
              <option value="cgb-reverse-b">cgb reverse B</option>
            </optgroup>
            <optgroup label="SGB Built-in">
              <option value="sgb-1a">sgb 1-A</option>
              <option value="sgb-1b">sgb 1-B</option>
              <option value="sgb-1c">sgb 1-C</option>
              <option value="sgb-1d">sgb 1-D</option>
              <option value="sgb-1e">sgb 1-E</option>
              <option value="sgb-1f">sgb 1-F</option>
              <option value="sgb-1g">sgb 1-G</option>
              <option value="sgb-1h">sgb 1-H</option>
              <option value="sgb-2a">sgb 2-A</option>
              <option value="sgb-2b">sgb 2-B</option>
              <option value="sgb-2c">sgb 2-C</option>
              <option value="sgb-2d">sgb 2-D</option>
              <option value="sgb-2e">sgb 2-E</option>
              <option value="sgb-2f">sgb 2-F</option>
              <option value="sgb-2g">sgb 2-G</option>
              <option value="sgb-2h">sgb 2-H</option>
              <option value="sgb-3a">sgb 3-A</option>
              <option value="sgb-3b">sgb 3-B</option>
              <option value="sgb-3c">sgb 3-C</option>
              <option value="sgb-3d">sgb 3-D</option>
              <option value="sgb-3e">sgb 3-E</option>
              <option value="sgb-3f">sgb 3-F</option>
              <option value="sgb-3g">sgb 3-G</option>
              <option value="sgb-3h">sgb 3-H</option>
              <option value="sgb-4a">sgb 4-A</option>
              <option value="sgb-4b">sgb 4-B</option>
              <option value="sgb-4c">sgb 4-C</option>
              <option value="sgb-4d">sgb 4-D</option>
              <option value="sgb-4e">sgb 4-E</option>
              <option value="sgb-4f">sgb 4-F</option>
              <option value="sgb-4g">sgb 4-G</option>
              <option value="sgb-4h">sgb 4-H</option>
            </optgroup>
          </select>
        </div>
        <div class="file-picker">
          <label id="palette-override-file-button" class="file-button" for="palette-override-file"
            >Load Palette Overrides</label
          >
          <input
            id="palette-override-file"
            type="file"
            accept=".ini,.cfg,.txt"
          />
        </div>
        <div class="inline">
          <div id="palette-override-info" class="status-card" aria-live="polite">
            Palette overrides: none loaded.
          </div>
          <button id="palette-override-clear" type="button">Clear overrides</button>
        </div>
        <div class="field">
          <label for="video-size">Video Size</label>
          <select id="video-size" aria-label="Video size">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
            <option value="4" selected>4x</option>
          </select>
        </div>
        <div class="file-picker">
          <label id="bootrom-file-button" class="file-button" for="bootrom-file">Load Boot ROM(s)</label>
          <input id="bootrom-file" type="file" accept=".bin,.rom,.gb,.gbc" multiple />
        </div>
        <div class="bootrom-status">
          <span id="bootrom-model-check" class="bootrom-check" aria-label="Boot ROM validity for selected hardware">✗</span>
          <div id="bootrom-info" class="status-card" aria-live="polite">Boot ROM: model dmg not configured.</div>
        </div>
      </section>

      <section id="panel-audio" class="panel-section" data-control-panel="audio" hidden>
        <span class="panel-label">Audio</span>
        <button id="audio-enable" type="button">Enable audio</button>
        <div class="field">
          <label for="audio-resampler">Resampler</label>
          <select id="audio-resampler">
            <option value="cubic" selected>cubic</option>
            <option value="linear">linear</option>
          </select>
        </div>
        <label class="checkbox-line">
          <input id="test-tone" type="checkbox" />
          Test tone
        </label>
        <div id="audio-telemetry" class="status-card">Audio: disabled</div>
      </section>

      <section id="panel-debug" class="panel-section" data-control-panel="debug" hidden>
        <span class="panel-label">Debug</span>
        <div id="debug-run-state" class="status-card">State: idle</div>
        <pre id="cart-info" aria-label="Cartridge metadata">Cartridge: not loaded.</pre>
        <div id="status">Load a ROM.</div>
        <pre id="serial" aria-label="Serial output"></pre>
      </section>
    </aside>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
