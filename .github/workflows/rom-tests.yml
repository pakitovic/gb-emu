name: ROM Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  rom-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: blargg-core
            run: scripts/run_blargg_core.sh
            allow_failure: false
          - name: blargg-mem-timing
            run: scripts/run_blargg_mem_timing.sh
            allow_failure: true
    continue-on-error: ${{ matrix.suite.allow_failure }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run ROM suite (${{ matrix.suite.name }})
        env:
          MAX_STEPS: "120000000"
        run: ${{ matrix.suite.run }}
