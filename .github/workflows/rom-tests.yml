name: ROM Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rom-blargg:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fetch Blargg ROMs
        run: scripts/blargg/fetch_blargg_roms.sh

      - name: Run ROM suite (blargg-all)
        env:
          MAX_STEPS: "120000000"
          TIMEOUT_SECS: "120"
        run: scripts/blargg/run_blargg.sh

  rom-gekkio:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fetch Gekkio ROMs
        run: scripts/gekkio/fetch_gekkio_roms.sh

      - name: Run ROM suite (gekkio-all)
        env:
          GEKKIO_SUITE: "all"
          MAX_STEPS: "120000000"
          TIMEOUT_SECS: "120"
        run: scripts/gekkio/run_gekkio.sh

      - name: Run ROM suite (gekkio-boot-models)
        env:
          GEKKIO_SUITE: "boot_models"
          MAX_STEPS: "120000000"
          TIMEOUT_SECS: "120"
        run: scripts/gekkio/run_gekkio.sh
