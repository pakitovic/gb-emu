[workspace]
members = [".", "frontends/sdl2"]
default-members = ["."]
resolver = "3"

[package]
name = "gb-emu"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
frontend-web = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
wasm-bindgen = { version = "0.2.100", optional = true }
js-sys = { version = "0.3.77", optional = true }
